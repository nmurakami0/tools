audio_file: /Users/murakaminaoya/Downloads/audio_20260507170427.m4a

split:
  chunk_size_mb: 20

output_dir: ./output

services:
  faster_whisper:
    base_url: "http://localhost:8000/v1/audio/transcriptions"
    model: "deepdml/faster-whisper-large-v3-turbo-ct2"
  openai_transcribe:
    model: "gpt-4o-transcribe"
  elevenlabs:
    base_url: "https://api.elevenlabs.io/v1/speech-to-text"
  openai_chat:
    model: "gpt-audio"
    base_url: "https://api.openai.com/v1/chat/completions"
  gemini:
    model: "gemini-3.1-flash-preview"
    base_url: "https://generativelanguage.googleapis.com/v1beta/models"

runs:
  - id: fw-ja-prompted
    service: faster_whisper
    settings:
      language: ja
      prompt: "句読点や読点を適切に付けてください。丁寧な日本語で書き起こしてください。"
      temperature: 0

  - id: fw-auto
    service: faster_whisper
    settings:
      temperature: 0

  - id: gpt4o-ja-prompted
    service: openai_transcribe
    settings:
      language: ja
      prompt: "句読点や読点を適切に付けてください。丁寧な日本語で書き起こしてください。"

  - id: gpt4o-auto
    service: openai_transcribe
    settings: {}

  - id: el-ja
    service: elevenlabs
    settings:
      model_id: scribe_v1
      language_code: ja

  - id: el-auto
    service: elevenlabs
    settings:
      model_id: scribe_v1

  - id: el-v2-ja
    service: elevenlabs
    settings:
      model_id: scribe_v2
      language_code: ja

  - id: el-v2-auto
    service: elevenlabs
    settings:
      model_id: scribe_v2

  - id: el-v2-ja-clean
    service: elevenlabs
    settings:
      model_id: scribe_v2
      language_code: ja
      no_verbatim: true

  - id: fw-multilingual
    service: faster_whisper
    settings:
      prompt: "OK so let me walk you through the current status. We finished the API integration last week. あと、認証のところはまだ残ってるんですけど、来週には対応できると思います。Right, and the dashboard metrics are looking good so far. 对，那个数据分析的部分我们已经完成了。Great, so next steps would be the load testing phase."
      temperature: 0

  - id: fw-ja-nocond
    service: faster_whisper
    settings:
      language: ja
      prompt: "句読点や読点を適切に付けてください。丁寧な日本語で書き起こしてください。"
      temperature: 0
      condition_on_previous_text: false

  - id: fw-multilingual-nocond
    service: faster_whisper
    settings:
      prompt: "OK so let me walk you through the current status. We finished the API integration last week. あと、認証のところはまだ残ってるんですけど、来週には対応できると思います。Right, and the dashboard metrics are looking good so far. 对，那个数据分析的部分我们已经完成了。Great, so next steps would be the load testing phase."
      temperature: 0
      condition_on_previous_text: false

  - id: gpt4o-multilingual
    service: openai_transcribe
    settings:
      prompt: "OK so let me walk you through the current status. We finished the API integration last week. あと、認証のところはまだ残ってるんですけど、来週には対応できると思います。Right, and the dashboard metrics are looking good so far. 对，那个数据分析的部分我们已经完成了。Great, so next steps would be the load testing phase."

  - id: fw-twopass
    service: two_pass
    settings:
      segment_seconds: 30
      confidence_threshold: 0.7
      fallback_language: ja
      pass1:
        service: faster_whisper
        settings:
          temperature: 0
      pass2:
        service: faster_whisper
        settings:
          temperature: 0
          prompt: "句読点や読点を適切に付けてください。丁寧な日本語で書き起こしてください。"

  - id: gpt4o-twopass
    service: two_pass
    settings:
      segment_seconds: 30
      confidence_threshold: 0.7
      fallback_language: ja
      pass1:
        service: faster_whisper
        settings:
          temperature: 0
      pass2:
        service: openai_transcribe
        settings:
          prompt: "句読点や読点を適切に付けてください。丁寧な日本語で書き起こしてください。"

  - id: gemini-flash-multilingual
    service: gemini
    settings:
      prompt: "添付の音声は日・英・中が混在する会議です。一切翻訳せず、発言された言語のまま、話者ごとに正確な文字起こしを生成してください。"
      temperature: 0

  - id: openai-chat-multilingual
    service: openai_chat
    settings:
      prompt: "添付の音声は日・英・中が混在する会議です。一切翻訳せず、発言された言語のまま、話者ごとに正確な文字起こしを生成してください。"
      temperature: 0

  - id: openai-chat-mini-multilingual
    service: openai_chat
    settings:
      model: "gpt-audio-mini"
      prompt: "添付の音声は日・英・中が混在する会議です。一切翻訳せず、発言された言語のまま、話者ごとに正確な文字起こしを生成してください。"
      temperature: 0

  - id: openai-chat-generic-minimal
    service: openai_chat
    settings:
      prompt: "添付の音声を文字起こししてください。"
      temperature: 0

  - id: openai-chat-generic-faithful
    service: openai_chat
    settings:
      prompt: "添付の音声を、発言された言語のまま、一切翻訳・要約せずに正確に文字起こししてください。複数言語が混在している場合も、それぞれの発言を元の言語で書き起こしてください。"
      temperature: 0

  - id: openai-chat-generic-verbatim
    service: openai_chat
    settings:
      prompt: "添付の音声を忠実に文字起こししてください。要件は次のとおりです。(1) 発言された言語のまま書き起こし、翻訳しない。(2) 言い直し・フィラー・相槌も含め、聞こえたままを再現する。(3) 句読点を適切に付与する。(4) 音声に含まれない説明・要約・コメントは出力しない。"
      temperature: 0

  - id: openai-chat-mini-generic-minimal
    service: openai_chat
    settings:
      model: "gpt-audio-mini"
      prompt: "添付の音声を文字起こししてください。"
      temperature: 0

  - id: openai-chat-mini-generic-faithful
    service: openai_chat
    settings:
      model: "gpt-audio-mini"
      prompt: "添付の音声を、発言された言語のまま、一切翻訳・要約せずに正確に文字起こししてください。複数言語が混在している場合も、それぞれの発言を元の言語で書き起こしてください。"
      temperature: 0

  - id: openai-chat-mini-generic-verbatim
    service: openai_chat
    settings:
      model: "gpt-audio-mini"
      prompt: "添付の音声を忠実に文字起こししてください。要件は次のとおりです。(1) 発言された言語のまま書き起こし、翻訳しない。(2) 言い直し・フィラー・相槌も含め、聞こえたままを再現する。(3) 句読点を適切に付与する。(4) 音声に含まれない説明・要約・コメントは出力しない。"
      temperature: 0
